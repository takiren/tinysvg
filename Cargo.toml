[package]
name = "tsvg"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
eframe = "0.37.0"
resvg = "0.49.0"
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSURL", "NSString", "NSObject"] }

[package.metadata.bundle]
name = "tsvg"
identifier = "io.github.taki.tsvg"
short_description = "A tiny SVG viewer"
category = "public.app-category.graphics-design"

[package.metadata.bundle.osx]
minimum_system_version = "11.0"
info_plist_exts = ["bundle/document-types.plist"]
